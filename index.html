<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Money Tracker</title>

  <base href="/" />

  <meta name="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
  <meta name="description" content="Money Tracker App" />

  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181818" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f3f3" />

  <meta name="color-scheme" content="dark light">
  <meta name="supported-color-schemes" content="dark light">

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PWA Starter" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <link rel="icon" href="/assets/icons/icon_24.png" type="image/png" />

  <link rel="manifest" href="/manifest.json" />

  <!-- Load both Shoelace themes; toggle dark via sl-theme-dark class -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/dark.css">

  <!-- Apply dark theme based on system preference; respond to changes at runtime -->
  <script>
    (function () {
      const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        document.documentElement.classList.toggle('sl-theme-dark', darkQuery.matches);
      }
      applyTheme();
      darkQuery.addEventListener('change', applyTheme);
    })();
  </script>

  <script type="module" src="/src/app-index.ts"></script>

</head>

<body>
  <app-index></app-index>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(
        '/sw.js'
      );
    }
  </script>
</body>

</html>
